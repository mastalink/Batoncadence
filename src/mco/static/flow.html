<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BatonCadence — Flow Control</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --dim: #8b93a3; --accent: #5b5bd6;
    --waiting: #6b7280; --approval: #f59e0b; --pending: #38bdf8;
    --running: #22c55e; --done: #16a34a; --failed: #ef4444; --stopped: #a855f7;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#faf9f5; --panel:#fff; --panel-2:#f2f3f7; --line:#e2e5ec;
            --text:#1a1d24; --dim:#6b7280; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .brand { font-weight: 650; letter-spacing: -.2px; }
  .brand span { color: var(--accent); }
  .spacer { flex: 1; }
  button, select, input { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--failed); border-color: var(--failed); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .live { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--running); }
  .dot.stale { background: var(--failed); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .dot.beating { animation: pulse 2s ease-in-out infinite; }

  main { flex: 1; display: flex; min-height: 0; }
  #canvas-wrap { flex: 1; overflow: auto; position: relative; }
  svg { display: block; }
  .node rect { stroke-width: 2; rx: 9; cursor: pointer; }
  .node text { pointer-events: none; }
  .node .title { font-size: 12.5px; font-weight: 600; }
  .node .meta { font-size: 11px; }
  .node.sel rect { stroke-width: 3.5; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; marker-end: url(#arrow); }
  .edge.hot { stroke: var(--accent); stroke-width: 2.5; }
  @keyframes dash { to { stroke-dashoffset: -12 } }
  .edge.flowing { stroke: var(--running); stroke-dasharray: 6 6; animation: dash .7s linear infinite; }

  aside { width: 380px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; }
  aside.hidden { display: none; }
  .pane-head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .pane-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .pane-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 13px; margin-bottom: 14px; }
  .kv dt { color: var(--dim); }
  .kv dd { word-break: break-word; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: #fff; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin: 16px 0 8px; }
  .event { border-left: 2px solid var(--line); padding: 6px 0 6px 11px; margin-bottom: 3px; font-size: 12.5px; }
  .event .when { color: var(--dim); font-size: 11.5px; }
  .empty { color: var(--dim); text-align: center; padding: 40px 20px; }
  .legend { display: flex; gap: 13px; flex-wrap: wrap; padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); flex-shrink: 0; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); padding: 10px 18px; border-radius: 9px; box-shadow: 0 6px 24px rgba(0,0,0,.3); z-index: 50; }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="brand">Baton<span>Cadence</span> · Flow Control</div>
  <label class="live"><input type="checkbox" id="only-active" style="cursor:pointer"> active only</label>
  <div class="spacer"></div>
  <div class="live"><span class="dot beating" id="pulse"></span><span id="status">connecting…</span></div>
  <button id="refresh">Refresh</button>
  <button id="settings">Token</button>
</header>

<main>
  <div id="canvas-wrap"><svg id="canvas"></svg></div>
  <aside id="pane" class="hidden">
    <div class="pane-head">
      <span class="badge" id="p-status"></span>
      <div style="font-weight:600;margin-top:8px" id="p-title"></div>
    </div>
    <div class="pane-body">
      <dl class="kv">
        <dt>Job</dt><dd><code id="p-id"></code></dd>
        <dt>Assigned</dt><dd id="p-target"></dd>
        <dt>From</dt><dd id="p-source"></dd>
        <dt>Created</dt><dd id="p-created"></dd>
        <dt>Depends on</dt><dd id="p-deps"></dd>
        <dt>Origin</dt><dd id="p-origin"></dd>
      </dl>
      <div id="p-desc-wrap"><h3>Instructions</h3><div id="p-desc" style="font-size:13px;white-space:pre-wrap"></div></div>
      <h3>Audit trail</h3>
      <div id="p-events"><div class="empty">—</div></div>
    </div>
    <div class="pane-foot">
      <button class="primary" id="a-approve">Approve</button>
      <button id="a-reject">Reject</button>
      <button id="a-retry">Retry</button>
      <button class="danger" id="a-cancel">Cancel</button>
    </div>
  </aside>
</main>

<div class="legend">
  <span><i style="background:var(--waiting)"></i>waiting</span>
  <span><i style="background:var(--approval)"></i>needs approval</span>
  <span><i style="background:var(--pending)"></i>pending</span>
  <span><i style="background:var(--running)"></i>leased / running</span>
  <span><i style="background:var(--done)"></i>completed</span>
  <span><i style="background:var(--failed)"></i>failed</span>
  <span><i style="background:var(--stopped)"></i>rejected / cancelled</span>
  <span class="spacer"></span>
  <span>edges are <code>depends_on</code> — the real gate, not decoration</span>
</div>

<script>
const STATUS_COLOR = {
  waiting: "--waiting", needs_approval: "--approval", pending: "--pending",
  leased: "--running", in_progress: "--running", completed: "--done",
  failed: "--failed", rejected: "--stopped", cancelled: "--stopped",
};
const ACTIVE = new Set(["waiting","needs_approval","pending","leased","in_progress"]);
const NODE_W = 210, NODE_H = 62, GAP_X = 90, GAP_Y = 26, PAD = 34;

let jobs = [], selected = null, timer = null;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const $ = id => document.getElementById(id);

function token() {
  let t = localStorage.getItem("mco_token");
  if (!t) { t = prompt("Paste your BatonCadence access token\n(Settings → Connection in the console)"); if (t) localStorage.setItem("mco_token", t.trim()); }
  return t;
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Authorization": "Bearer " + (token() || ""), "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  if (res.status === 401) { localStorage.removeItem("mco_token"); throw new Error("401 — token rejected"); }
  if (!res.ok) throw new Error(res.status + " " + res.statusText);
  return res.status === 204 ? null : res.json();
}

/* ── layout: longest-path layering, so an edge always points forward ───────── */
function layer(nodes) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  const depth = new Map(), visiting = new Set();
  const walk = id => {
    if (depth.has(id)) return depth.get(id);
    if (visiting.has(id)) return 0;           // cycle guard: never hang the UI
    visiting.add(id);
    const deps = (byId.get(id)?.depends_on || []).filter(d => byId.has(d));
    const d = deps.length ? Math.max(...deps.map(walk)) + 1 : 0;
    visiting.delete(id); depth.set(id, d);
    return d;
  };
  nodes.forEach(n => walk(n.id));
  const cols = [];
  nodes.forEach(n => { const d = depth.get(n.id) || 0; (cols[d] ||= []).push(n); });
  cols.forEach(col => col.sort((a, b) => (a.created_at || "").localeCompare(b.created_at || "")));
  return cols;
}

function render() {
  const svg = $("canvas");
  const visible = $("only-active").checked ? jobs.filter(j => ACTIVE.has(j.status)) : jobs;
  svg.innerHTML = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="${css('--line')}"/></marker></defs>`;

  if (!visible.length) {
    svg.setAttribute("width", 600); svg.setAttribute("height", 200);
    svg.innerHTML += `<text x="40" y="90" fill="${css('--dim')}" font-size="14">No jobs to display.</text>`;
    return;
  }

  // Layers become columns; a layer taller than MAX_ROWS wraps into a grid of
  // sub-columns. Without this, a board of 100 independent jobs (the common
  // case - most work has no dependencies) renders as one unusable 100-tall
  // column.
  const MAX_ROWS = 12;
  const cols = layer(visible);
  const pos = new Map();
  let cursorX = PAD, maxRows = 1;
  cols.forEach(col => {
    const subs = Math.ceil(col.length / MAX_ROWS) || 1;
    const rows = Math.ceil(col.length / subs);
    maxRows = Math.max(maxRows, Math.min(col.length, rows));
    col.forEach((n, i) => {
      const sub = Math.floor(i / rows), row = i % rows;
      pos.set(n.id, {
        x: cursorX + sub * (NODE_W + GAP_X),
        y: PAD + row * (NODE_H + GAP_Y),
      });
    });
    // Layers stay separated by a wider gutter so dependency direction reads.
    cursorX += subs * (NODE_W + GAP_X) + (subs > 1 ? GAP_X * 0.5 : 0);
  });

  const w = cursorX + PAD;
  const h = PAD * 2 + maxRows * (NODE_H + GAP_Y);
  svg.setAttribute("width", w); svg.setAttribute("height", h);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);

  // edges first so nodes sit on top
  let markup = "";
  visible.forEach(n => {
    (n.depends_on || []).forEach(dep => {
      const a = pos.get(dep), b = pos.get(n.id);
      if (!a || !b) return;
      const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2, x2 = b.x, y2 = b.y + NODE_H / 2;
      const mid = (x1 + x2) / 2;
      const upstream = visible.find(j => j.id === dep);
      const cls = upstream?.status === "completed" && ACTIVE.has(n.status) ? "edge flowing"
                : selected && (selected === n.id || selected === dep) ? "edge hot" : "edge";
      markup += `<path class="${cls}" d="M${x1} ${y1} C${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}"/>`;
    });
  });

  visible.forEach(n => {
    const p = pos.get(n.id);
    const colour = css(STATUS_COLOR[n.status] || "--waiting");
    const title = (n.title || "(untitled)").slice(0, 26);
    const target = [n.target_agent_role, n.target_agent_id].filter(Boolean).join(" / ").slice(0, 28);
    const gate = n.status === "needs_approval" ? " ⏸" : "";
    markup += `<g class="node ${selected === n.id ? "sel" : ""}" data-id="${n.id}">
      <rect x="${p.x}" y="${p.y}" width="${NODE_W}" height="${NODE_H}"
            fill="${css('--panel')}" stroke="${colour}"/>
      <rect x="${p.x}" y="${p.y}" width="5" height="${NODE_H}" fill="${colour}" rx="2"/>
      <text class="title" x="${p.x + 15}" y="${p.y + 24}" fill="${css('--text')}">${esc(title)}${gate}</text>
      <text class="meta" x="${p.x + 15}" y="${p.y + 43}" fill="${css('--dim')}">${esc(target || "—")}</text>
      <text class="meta" x="${p.x + NODE_W - 12}" y="${p.y + 43}" fill="${colour}" text-anchor="end">${n.status}</text>
    </g>`;
  });
  svg.innerHTML += markup;

  svg.querySelectorAll(".node").forEach(g =>
    g.addEventListener("click", () => select(g.dataset.id)));
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function select(id) {
  selected = id;
  const job = jobs.find(j => j.id === id);
  if (!job) return;
  $("pane").classList.remove("hidden");
  $("p-status").textContent = job.status;
  $("p-status").style.background = css(STATUS_COLOR[job.status] || "--waiting");
  $("p-title").textContent = job.title || "(untitled)";
  $("p-id").textContent = job.id.slice(0, 8);
  $("p-target").textContent = [job.target_agent_role, job.target_agent_id].filter(Boolean).join(" / ") || "—";
  $("p-source").textContent = [job.source_agent_role, job.source_agent_id].filter(Boolean).join(" / ") || "—";
  $("p-created").textContent = job.created_at ? new Date(job.created_at).toLocaleString() : "—";
  $("p-deps").textContent = (job.depends_on || []).map(d => d.slice(0, 8)).join(", ") || "none";

  // The scheduler stamps this — it is what lets the trail answer
  // "what created this job?" months later.
  const origin = (job.input_payload || {}).origin;
  $("p-origin").textContent = origin
    ? `${origin.trigger}: ${origin.schedule || origin.launcher}` + (origin.iteration ? ` #${origin.iteration}` : "")
    : "manual";

  $("p-desc").textContent = job.description || "—";
  $("a-approve").disabled = job.status !== "needs_approval";
  $("a-reject").disabled = job.status !== "needs_approval";
  $("a-retry").disabled = !["failed", "rejected", "cancelled"].includes(job.status);
  $("a-cancel").disabled = !ACTIVE.has(job.status);
  render();

  $("p-events").innerHTML = `<div class="empty">loading…</div>`;
  try {
    const events = await api(`/api/jobs/${id}/events`);
    const list = Array.isArray(events) ? events : (events.events || []);
    $("p-events").innerHTML = list.length ? list.map(e => `
      <div class="event"><div>${esc(e.event_type || e.event || "event")}
        ${e.actor_instance_id || e.actor ? `<span style="color:var(--dim)"> · ${esc(e.actor_instance_id || e.actor)}</span>` : ""}</div>
        <div class="when">${e.created_at ? new Date(e.created_at).toLocaleString() : ""}</div></div>`).join("")
      : `<div class="empty">No events recorded.</div>`;
  } catch (err) {
    $("p-events").innerHTML = `<div class="empty">Could not load: ${esc(err.message)}</div>`;
  }
}

async function act(verb) {
  if (!selected) return;
  const label = { approve: "Approve", reject: "Reject", retry: "Retry", cancel: "Cancel" }[verb];
  const job = jobs.find(j => j.id === selected);
  // Governance actions are consequential; confirm before firing.
  if (!confirm(`${label} this job?\n\n${job?.title || selected}`)) return;
  try {
    await api(`/api/jobs/${selected}/${verb}`, { method: "POST", body: JSON.stringify({}) });
    toast(`${label}d.`);
    await load();
    await select(selected);
  } catch (err) { toast("Failed: " + err.message); }
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

async function load() {
  try {
    const data = await api("/api/jobs");
    jobs = Array.isArray(data) ? data : (data.jobs || []);
    $("status").textContent = `${jobs.length} jobs · ${new Date().toLocaleTimeString()}`;
    $("pulse").classList.remove("stale");
    render();
  } catch (err) {
    $("status").textContent = err.message;
    $("pulse").classList.add("stale");
  }
}

$("refresh").onclick = load;
$("only-active").onchange = render;
$("settings").onclick = () => { localStorage.removeItem("mco_token"); token(); load(); };
$("a-approve").onclick = () => act("approve");
$("a-reject").onclick = () => act("reject");
$("a-retry").onclick = () => act("retry");
$("a-cancel").onclick = () => act("cancel");
document.addEventListener("keydown", e => { if (e.key === "Escape") { selected = null; $("pane").classList.add("hidden"); render(); } });

load();
timer = setInterval(load, 5000);
</script>
</body>
</html>
